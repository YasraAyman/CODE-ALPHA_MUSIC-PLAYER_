<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Music Player</title>
  <link rel="stylesheet" href="task4.css"/>
</head>
<body>
  <div class="player-container">
    <div class="album-art">
      <img id="cover" src=" " alt="Music Player Album Cover"/>
</div>
    <div class="info">
      <h2 id="title">Title</h2>
      <p id="artist">Artist</p>
    </div>
    <audio id="audio" src=""></audio>
    <div class="controls">
      <button id="prev" aria-label="Previous"><span>&laquo;</span></button>
      <button id="play" aria-label="Play"><span>&#9654;</span></button>
      <button id="next" aria-label="Next"><span>&raquo;</span></button>
      <button id="repeat" aria-label="Repeat"><span>&#128257;</span></button>
    </div>
    <div class="progress-container">
      <span id="current-time">0:00</span>
      <div id="progress-bar-bg">
        <div id="progress-bar"></div>
      </div>
      <span id="duration">0:00</span>
    </div>
    <div class="volume-container">
      <button id="mute" aria-label="Mute"><span>&#128266;</span></button>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" />
    </div>
    <ul class="playlist" id="playlist"></ul>
  </div>
  <script src="task4.js"></script>
</body>
</html>
